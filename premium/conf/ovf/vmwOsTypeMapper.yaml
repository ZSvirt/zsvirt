# key is "ovf:id" in tag "OperatingSystemSection" from OVF template
# value is guest operating system parameters:
#    osType:    Operating system name
#    platform:  Operating system platform, 'Windows', 'Linux', and 'Other'
#    arch:      System architecture, 'x86' or 'x64'. 
#               If some "ovf:id" can correspond to the OS of x86 architecture or x64, fill 'x86_64'
# data source: https://wiki.abiquo.com/display/doc/Guest+operating+system+definition+for+VMware

